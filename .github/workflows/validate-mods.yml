name: Validate mods registry

on:
  pull_request:
    paths:
      - "mods/**"
      - ".github/workflows/validate-mods.yml"
  push:
    branches:
      - main
    paths:
      - "mods/**"
      - ".github/workflows/validate-mods.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mods/validate_registry.mjs
      - run: node --test mods/validate_registry.test.mjs
