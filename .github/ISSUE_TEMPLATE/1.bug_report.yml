name: Bug report
description: Report a bug for Command Code.
type: Bug
labels: []
body:
    - type: markdown
      attributes:
          value: |
              Use this template to report bugs for Command Code. Feel free to [start a new thread in our discord forum](https://commandcode.ai/discord).
    - type: textarea
      id: summary
      attributes:
          label: Summary
          description: Briefly describe the issue and how it affects your workflow.
          placeholder: Command Code hangs after /compact and I cannot send the queued message.
      validations:
          required: true
    - type: textarea
      id: expected-behavior
      attributes:
          label: Expected Behavior
          description: Describe the expected behavior you were expecting.
          placeholder: Expected behavior...
      validations:
          required: true
    - type: textarea
      id: actual-behavior
      attributes:
          label: Actual Behavior
          description: Describe the actual behavior that occurred.
          placeholder: Actual behavior...
      validations:
          required: true
    - type: textarea
      id: steps-to-reproduce
      attributes:
          label: Steps to reproduce the issue
          description: Describe the actual steps to reproduce the issue.
          placeholder: |
              1. ...
              2. ...
              3. ...
              4. ...
      validations:
          required: true
    - type: dropdown
      id: surface
      attributes:
          label: Surface / entry path
          description: Which entry path triggers the bug? (ACP and Chat share the `cmd acp` path.)
          options:
              - Interactive TUI (cmd)
              - ACP (cmd acp / Zed / agent client)
              - Chat (AO Chat / IDE integration)
              - Headless (cmd -p)
              - Other
      validations:
          required: true
    - type: textarea
      id: exact-command
      attributes:
          label: Exact command
          description: Paste the full command including all flags, exactly as run.
          placeholder: |
              cmd acp --mod ./x.ts --trust
      validations:
          required: false
    - type: textarea
      id: repro-mod
      attributes:
          label: Minimal repro (mod / config)
          description: Smallest mod file, flag, or config that triggers it. Keep it under 20 lines.
          placeholder: |
              export default function (cmd) {
                cmd.hooks({ appendSystemPrompt: () => 'REPRO-SENTINEL' })
              }
      validations:
          required: false
    - type: textarea
      id: debug-log
      attributes:
          label: Debug log excerpt
          description: |
              Rerun with DEBUG=true, then paste only the newest lines from ~/.commandcode/logs/command.log (the `args:` line plus what follows). Redact secrets.
          placeholder: |
              args: acp --mod ./x.ts --trust
              [cmd] subcommand: acp
              ...
      validations:
          required: false
    - type: input
      id: version
      attributes:
          label: Command Code Version
          description: Run `cmd --version` to get the version.
          placeholder: 0.0.1
      validations:
          required: true
    - type: dropdown
      id: os
      attributes:
          label: Operating System
          options:
              - macOS
              - Linux
              - Windows
              - Other  
      validations:
          required: true
    - type: input
      id: terminal
      attributes:
          label: Terminal/IDE
          description: Which terminal or IDE are you using?
          placeholder: vscode
    - type: input
      id: shell
      attributes:
          label: Shell
          description: Which shell are you using?
          placeholder: zsh
    - type: textarea
      id: session-file
      attributes:
          label: Session file (optional)
          description: Run `/export jsonl` and drop the file here. Redact secrets first — it holds the whole session.
          placeholder: Drag the .jsonl here...
    - type: textarea
      id: fix-prompt
      attributes:
          label: Fix prompt (optional)
          description: How would you prompt a coding agent to fix this? Where it lives, what's correct, how to check.
          placeholder: "Prompt to help Command Code fix and improve itself …"
    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: |
              Any additional information that might help us investigate. Include error logs, screenshots, or environment details.
